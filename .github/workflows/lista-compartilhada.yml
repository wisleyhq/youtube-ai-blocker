# Recebe contribuições para a lista compartilhada (lists/ai-list.json).
#
# A extensão abre uma issue com o título "[lista] ..." e os IDs dos vídeos num
# bloco ```aib-ids```. Este robô confere cada vídeo no YouTube e só adiciona os
# que têm o selo oficial "Criado com IA". Nada do que a pessoa escreve é
# confiado: só IDs de vídeo válidos são lidos, e o texto da issue nunca é
# executado (vai por variável de ambiente para o script).

name: Lista compartilhada

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Uma contribuição por vez, para os commits não se atropelarem
concurrency:
  group: lista-compartilhada
  cancel-in-progress: false

jobs:
  conferir:
    if: startsWith(github.event.issue.title, '[lista]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conferir o selo dos vídeos no YouTube
        id: verify
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/verify-list.mjs

      - name: Salvar a lista
        if: steps.verify.outputs.added != '0'
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists/ai-list.json
          git commit -m "Lista compartilhada: contribuição da issue #${NUM}"
          git pull --rebase
          git push

      - name: Responder e fechar a issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$(cat resultado.md)"

      - name: Avisar se o YouTube recusou as consultas
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: >
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY"
          --body "Não consegui conferir os vídeos agora (o YouTube pode ter recusado as consultas). A issue fica aberta para uma nova tentativa."
